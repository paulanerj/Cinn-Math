name: Auto-merge Claude PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - master

jobs:
  auto-merge:
    if: startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Auto-merge claude/ branch PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            console.log(`Auto-merging PR #${pr.number}: ${pr.title}`);
            console.log(`Branch: ${pr.head.ref} → ${pr.base.ref}`);

            // Wait briefly to allow checks to register
            await new Promise(resolve => setTimeout(resolve, 3000));

            try {
              await github.rest.pulls.merge({
                owner,
                repo,
                pull_number: pr.number,
                merge_method: 'squash',
                commit_title: `${pr.title} (#${pr.number})`,
                commit_message: `Auto-merged from ${pr.head.ref}\n\nOriginal PR: ${pr.html_url}`,
              });
              console.log(`Successfully merged PR #${pr.number}`);
            } catch (error) {
              console.error(`Failed to merge PR #${pr.number}: ${error.message}`);
              throw error;
            }
