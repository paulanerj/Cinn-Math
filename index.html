<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GridMathSystem Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Nunito', sans-serif;
      margin: 0;
      padding: 0;
      background: #1a1a1c;
      overflow: hidden;
      overscroll-behavior: none;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }
    @keyframes slide-up {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    /* ── Tile keyframes — single global definition (moved from per-tile <style>) ── */
    /* Values match uiTokens.ts. Update both together per COMBINE_GRID_UI_CONTRACT.md. */
    @keyframes bomb-spark {
      from { transform: translateY(0) scale(1);       opacity: 0.75; }
      to   { transform: translateY(-2px) scale(1.35); opacity: 1;    }
    }
    @keyframes bomb-heat {
      from { opacity: 0.5;  }
      to   { opacity: 0.95; }
    }
    @keyframes zap-jitter {
      0%   { transform: translate(0,0);      }
      25%  { transform: translate(2px,-2px); }
      50%  { transform: translate(-2px,1px); }
      75%  { transform: translate(1px,2px);  }
      100% { transform: translate(0,0);      }
    }
    @keyframes zap-flash {
      0%, 100% { filter: brightness(1);                 }
      50%      { filter: brightness(1.5) saturate(1.5); }
    }
    @keyframes factor-reveal {
      0%   { box-shadow: 0 0 0 0   rgba(249,115,22,0),    0 3px 0 rgba(0,0,0,0.22); }
      45%  { box-shadow: 0 0 0 3px rgba(249,115,22,0.65), 0 0 14px rgba(249,115,22,0.35), 0 3px 0 rgba(0,0,0,0.22); }
      100% { box-shadow: 0 0 0 2px rgba(249,115,22,0.55), 0 0 10px rgba(249,115,22,0.25), 0 3px 0 rgba(0,0,0,0.22); }
    }
    .factor-glow {
      animation: factor-reveal 650ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes factor-reveal-one {
      0%   { box-shadow: 0 0 0 0   rgba(56,189,248,0),    0 3px 0 rgba(0,0,0,0.22); }
      45%  { box-shadow: 0 0 0 3px rgba(56,189,248,0.65), 0 0 14px rgba(56,189,248,0.30), 0 3px 0 rgba(0,0,0,0.22); }
      100% { box-shadow: 0 0 0 2px rgba(56,189,248,0.55), 0 0 10px rgba(56,189,248,0.20), 0 3px 0 rgba(0,0,0,0.22); }
    }
    .factor-glow-one {
      animation: factor-reveal-one 650ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
  <div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
