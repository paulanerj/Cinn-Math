<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>SpeedMath Arena</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800;900&family=Varela+Round&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Fredoka', 'Varela Round', 'sans-serif'] } } }
    }
  </script>
  <!-- Theme detection: must run before React to prevent dark-mode flash -->
  <script>
    (function () {
      try {
        const settings = JSON.parse(localStorage.getItem('speedMathSettings') || '{}');
        const phase = settings.phaseSequence || [];
        if (phase.some(p => p.mode === 'dark')) {
          document.documentElement.classList.add('sa-theme-dark');
          document.body.classList.add('sa-theme-dark');
          document.body.style.background = '#0F172A';
        }
      } catch(e){}
    })();
  </script>
</head>
<body class="sa-app">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
